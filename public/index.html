<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT-Incremental</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css"
    >
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="mobile-message">
        <h1>GPT-Incremental</h1>
        <p>please use the desktop version to play!</p>
    </div>

    <main id="terminal-container">
        <div id="terminal"></div>
    </main>

    <div id="save-panel">
        <div id="save-panel-header">
        <span>Save options</span>
        <span id="save-panel-arrow">▲</span>
        </div>

        <div id="save-panel-content">
            <div class="save-section">
                <label>Your save code</label>
                <div id="save-code">No save generated</div>
                <button id="copy-save">Copy save code</button>
            </div>

            <div class="save-section">
                <label>Load a save</label>
                <input id="load-save-input" type="text" placeholder="Place save code...">
                <button id="load-save">Load save</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="script.js"></script>
</body>
</html>
